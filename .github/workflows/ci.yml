name: Node.js CI and Docker deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Build Docker image and deploy to EC2'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Node.js build and artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist/
          if-no-files-found: error

  deploy:
    name: Docker build and EC2 deployment
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 }}
    concurrency:
      group: docker-ec2-main
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bondarenko-node-ci
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to Docker Hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: printf '%s' "$TOKEN" | docker login --username "$USERNAME" --password-stdin
      - name: Build and publish image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$GITHUB_REF_NAME" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
      - name: Prepare SSH
        env:
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          HOST_KEY: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$KEY_B64" | base64 --decode > ~/.ssh/ec2_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy and verify on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" bash -s -- "$IMAGE:$GITHUB_SHA" <<'REMOTE'
          set -eu
          sudo docker pull "$1"
          sudo docker rm -f nodeapp || true
          sudo docker run -d --restart unless-stopped --name nodeapp -p 127.0.0.1:3000:3000 "$1"
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:3000/
          REMOTE

