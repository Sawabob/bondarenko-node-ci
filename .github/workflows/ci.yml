name: Node.js CI and Docker deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Deploy to EC2 after the Docker checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Node.js build and artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker build, Compose check and publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-main
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/bondarenko-node-ci
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t "$IMAGE_REPOSITORY:$IMAGE_TAG" .
      - name: Check app and PostgreSQL with Compose
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          trap 'docker compose logs app; docker compose down --volumes' EXIT
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose ps
          curl -fsS http://127.0.0.1:3000/ | grep -F '<h1>Hello CI</h1>'
          curl -fsS http://127.0.0.1:3000/healthz | grep -Fx 'postgresql: ok'
      - name: Sign in to Docker Hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: printf '%s' "$TOKEN" | docker login --username "$USERNAME" --password-stdin
      - name: Publish commit and branch tags
        run: |
          docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker tag "$IMAGE_REPOSITORY:$IMAGE_TAG" "$IMAGE_REPOSITORY:$GITHUB_REF_NAME"
          docker push "$IMAGE_REPOSITORY:$GITHUB_REF_NAME"

  deploy:
    name: Deploy Compose to EC2
    needs: docker
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 && github.ref == 'refs/heads/main' }}
    concurrency:
      group: docker-ec2-main
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/bondarenko-node-ci
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare SSH
        env:
          KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          HOST_KEY: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$KEY_B64" | base64 --decode > ~/.ssh/ec2_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy and verify on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          host="$EC2_USER@$EC2_HOST"
          ssh_options=(-i "$HOME/.ssh/ec2_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$host" 'sudo docker compose version && mkdir -p "$HOME/optima-node-compose"'
          scp "${ssh_options[@]}" docker-compose.yml "$host:optima-node-compose/"
          ssh "${ssh_options[@]}" "$host" bash -s -- "$IMAGE_REPOSITORY" "$IMAGE_TAG" <<'REMOTE'
          set -eu
          cd "$HOME/optima-node-compose"

          if [ ! -f .env ]; then
            umask 077
            password="$(openssl rand -hex 24)"
            printf 'POSTGRES_PASSWORD=%s\n' "$password" > .env
          fi

          compose() {
            sudo env IMAGE_REPOSITORY="$image_repository" IMAGE_TAG="$image_tag" docker compose "$@"
          }

          image_repository="$1"
          image_tag="$2"
          compose pull
          sudo docker rm -f nodeapp || true
          compose up -d --no-build --wait --wait-timeout 120
          compose ps
          curl -fsS http://127.0.0.1:3000/ | grep -F '<h1>Hello CI</h1>'
          curl -fsS http://127.0.0.1:3000/healthz | grep -Fx 'postgresql: ok'
          REMOTE
