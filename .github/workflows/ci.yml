name: Node.js CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: error
      - name: Prepare SSH
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az -e 'ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            dist/ index.js "$EC2_USER@$EC2_HOST:nodeapp/"
      - name: Start and verify application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" <<'REMOTE'
          set -eu
          cd "$HOME/nodeapp"
          if pm2 describe optima-node-ci >/dev/null 2>&1; then
            pm2 restart optima-node-ci
          else
            pm2 start index.js --name optima-node-ci
          fi
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:3000/
          REMOTE
