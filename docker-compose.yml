services:
  app:
    build: .
    image: "${IMAGE_REPOSITORY:-bondarenko-node-ci}:${IMAGE_TAG:-local}"
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      PGHOST: db
      PGUSER: optima
      PGDATABASE: optima
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: optima
      POSTGRES_DB: optima
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U optima -d optima"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
